name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
      - run: npx --yes skills@1.5.25 add . --skill tokensmind-agent-network-runtime -a codex -y
